<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>
    <main class="the-main">
        <form class="the-form">
            <h1 class="title">Registration Form</h1>
            <div class="div1">
                <label class="lab1" for="">First Name
                    <input class="input1" type="text" placeholder="Enter first name">
                </label>
                <label class="lab1" for="">Last Name
                    <input class="input1" type="text" placeholder="Enter last name">
                </label>
            </div>
            <div>
                <label class="lab2" for="">Email
                    <input class="input2" type="email" placeholder="Enter email">
                </label>
            </div>
            <div class="div1">
                <label class="lab3" for="">Password
                    <input class="input1" type="password" placeholder="Enter Password">
                </label>
                <label class="lab3" for="">Age
                    <input class="input1" type=" number" placeholder="Enter age">
                </label>
            </div>
            <label class="lab3">Country
                <select class="input3" class="select" name="" id="">
                    <option class="select" value="Morocco">Morocco</option>
                    <option class="select" value="USA">USA</option>
                    <option class="select" value="Canada">Canada</option>
                    <option class="select" value="India">India</option>
                </select>
            </label>
            <label class="lab4" for="">Gender
                <div class="div2">
                    <input type="radio" name="gender">
                    <label for="">Male</label>
                    <input type="radio" name="gender">
                    <label for="radio">Female</label>
                </div>
            </label>
            <label class="lab4" for="">Skills
                <div>
                    <input type="checkbox">
                    <label for="html">HTML</label>
                    <input type="checkbox">
                    <label for="css">CSS</label>
                    <input type="checkbox">
                    <label for="js">JavaScript</label>
                </div>
            </label>
            <label  class="lab4" for="msg">Message
                <textarea class="input4 " name="" id="" placeholder="Write somethig..."></textarea>
            </label>
            <label class="lab1" for="">Upload CV
                <input class="input5" type="file">
            </label>
            <button class="btn">Register</button>
        </form>
    </main>
</body>

</html>
