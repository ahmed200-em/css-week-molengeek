<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Flex Layout</title>
</head>
<body>
    <!-- the main  -->
    <main class="the-main">
    <!-- ! this first section -->
    <section class="first-section">
        <!-- todo the two div in the fs-section  -->
        <div class="fs-twoDiv">
            <div class="fs-div1"><p>1</p></div>
            <div class="fs-div1"><p>2</p></div>
        </div>
        <!-- todo the third div in the first section  -->
        <div class="fs-div2"><p>3</p></div>
    </section>
    <!-- ! the second section -->
    <section class="second-section">
        <!-- todo the first div in the second section  -->
        <div class="s-threediv">
            <div class="s-div1"><p>1</p></div>
            <div class="s-div1"><p>2</p></div>
            <div class="s-div1"><p>3</p></div>
        </div>
        <!-- todo the second div in the second section  -->
        <div class="s-twodiv">
            <div class="s-div2"><p>4</p></div>
            <div class="s-div2"><p>5</p></div>
        </div>
    </section>
    <!-- ! the third section -->
    <section class="third-section">
        <!--todo the first five in third section  -->
        <div class="five-div">
            <div class="f-div">1</div>
            <div class="f-div">2</div>
            <div class="f-div">3</div>
            <div class="f-div">4</div>
            <div class="f-div">5</div>
        </div>
        <!--todo the two div in third section  -->
        <div class="two-div2">
            <div class="t-div">6</div>
            <div class="t-div">7</div>
        </div>

    </section>

</main>
</body>
</html>
